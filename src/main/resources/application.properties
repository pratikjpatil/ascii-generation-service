spring.application.name=AsciiGenerationService
spring.profiles.active=local
server.port=8084

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME}

spring.datasource.hikari.maximum-pool-size=100
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=30000

spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.cache.type=redis

hadoop.fs.uri=${HADOOP_URI}
hadoop.fs.user=${HADOOP_USER}
hadoop.fs.ha.nn1.rpc=${HADOOP_NN1}
hadoop.fs.ha.nn2.rpc=${HADOOP_NN2}
hadoop.fs.ha.nn3.rpc=${HADOOP_NN3}
hadoop.fs.ha.nn4.rpc=${HADOOP_NN4}
hadoop.fs.ha.nn5.rpc=${HADOOP_NN5}

spring.kafka.bootstrap-servers=${KAFKA_CONSUMER_BOOTSTRAP_SERVERS}
spring.kafka.consumer.group-id=Airflow_ETL
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=com.tcs.fincore.AsciiGenerationService.dto.ReportGenerationDTO
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

app.input.base.path=/reports
procedure.ascii.parsetemplate=SP_PARSE_REPORT_TEMPLATE
procedure.ascii.generate=SP_GENERATE_TB_ASCII_AND_REPORT

logging.level.org.apache.kafka=OFF
logging.level.kafka=OFF