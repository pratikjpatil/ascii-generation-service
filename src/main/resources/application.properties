spring.application.name=AsciiGenerationService

spring.datasource.url=${DB_URL:jdbc:oracle:thin:@localhost:1521/fincorepdb1}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
server.port=${SERVER_PORT:8084}

spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:100}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:10}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:30000}

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.cache.type=redis

hadoop.fs.uri=${HADOOP_FS_URI:file:///}
hadoop.fs.user=${HADOOP_FS_USER:}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP_ID:Airflow_ETL}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.tcs.fincore.AsciiGenerationService.dto
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=com.tcs.fincore.AsciiGenerationService.dto.ReportGenerationDTO
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

app.input.base.path=${APP_INPUT_BASE_PATH:/reports}

logging.level.org.apache.kafka=${KAFKA_LOG_LEVEL:WARN}
logging.level.kafka=${KAFKA_LOG_LEVEL:WARN}
